<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="0.55" stop-color="#5B5BF0"/>
      <stop offset="1" stop-color="#8B3DF0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1b1070" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="190"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="420" fill="url(#gloss)"/>
    <circle cx="840" cy="930" r="360" fill="#fff" opacity="0.06"/>
  </g>
  <g filter="url(#shadow)" fill="url(#glyph)" stroke="url(#glyph)" stroke-linejoin="round" stroke-linecap="round">
    <!-- shaft -->
    <rect x="450" y="248" width="124" height="290" rx="38" stroke="none"/>
    <!-- arrow head, which is also a "play" triangle pointing down -->
    <path d="M332 506 L692 506 L512 722 Z" stroke-width="64"/>
    <!-- tray -->
    <rect x="292" y="778" width="440" height="68" rx="34" stroke="none"/>
  </g>
</svg>
